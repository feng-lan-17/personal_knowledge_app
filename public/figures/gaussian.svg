<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="一个拉长的高斯：中心是均值，轴表示协方差" font-family="Source Han Sans SC, Noto Sans SC, Microsoft YaHei, WenQuanYi Micro Hei, sans-serif">
  <rect width="760" height="280" fill="#fbf8f2"/>
  <g transform="translate(250 140)">
    <ellipse rx="150" ry="62" transform="rotate(-28)" fill="none" stroke="#1c1916" stroke-width="1.4"/>
    <ellipse rx="96" ry="36" transform="rotate(-28)" fill="none" stroke="#c9bda8" stroke-width="1"/>
    <path d="M0 0 L118 -62" stroke="#8d3a2e" stroke-width="1.3"/>
    <path d="M0 0 L28 52" stroke="#234742" stroke-width="1.3"/>
    <circle r="3.5" fill="#1c1916"/>
  </g>
  <g fill="#1c1916" font-family="serif" font-size="18">
    <text x="250" y="128">μ</text>
    <text x="392" y="68">较长的轴</text>
    <text x="292" y="214">较短的轴</text>
  </g>
  <text x="48" y="40" fill="#6f675c" font-family="sans-serif" font-size="14">均值决定中心，协方差决定拉长的方向和尺度。颜色与不透明度不画在这张图里。</text>
</svg>
